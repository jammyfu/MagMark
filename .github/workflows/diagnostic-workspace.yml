name: Branch diagnostic workspace

# Read-only reproduction aid; only public source/dependencies are archived.
on:
  push:
    branches: [feat/cjk-publishing-upgrade-20260914]
    paths: [.github/workflows/diagnostic-workspace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    if: github.ref == 'refs/heads/feat/cjk-publishing-upgrade-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Resolve proposed production dependencies without install scripts
        run: npm install --ignore-scripts --save-exact remark-gfm@4 remark-frontmatter@5 remark-breaks@4 rehype-raw@7 rehype-sanitize@6 codemirror@6 @codemirror/lang-markdown@6 @codemirror/state@6 @codemirror/view@6 @codemirror/commands@6 @codemirror/language@6 pagedjs@0.4.3
      - name: Isolated optional AGPL benchmark runtime, not a production dependency
        run: npm install --prefix "$RUNNER_TEMP/publication-bench" --ignore-scripts --save-exact @vivliostyle/core@2.45.1
      - name: Package tracked public source and explicitly separate proposed manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/magmark-diagnostic"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/magmark-diagnostic/source.tar.gz"
          tar --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' -czf "$RUNNER_TEMP/magmark-diagnostic/dependencies.tar.gz" node_modules
          tar --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' -czf "$RUNNER_TEMP/magmark-diagnostic/optional-benchmark.tar.gz" -C "$RUNNER_TEMP/publication-bench" .
          cp package.json "$RUNNER_TEMP/magmark-diagnostic/proposed-package.json"
          cp package-lock.json "$RUNNER_TEMP/magmark-diagnostic/proposed-package-lock.json"
          git rev-parse HEAD > "$RUNNER_TEMP/magmark-diagnostic/source-commit.txt"
          node --version > "$RUNNER_TEMP/magmark-diagnostic/node-version.txt"
          cd "$RUNNER_TEMP/magmark-diagnostic"
          sha256sum source.tar.gz dependencies.tar.gz optional-benchmark.tar.gz proposed-package.json proposed-package-lock.json > checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: magmark-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/magmark-diagnostic/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
