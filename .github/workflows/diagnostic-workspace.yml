name: Branch diagnostic workspace

# Temporary reproduction aid for the approved publishing branch. No deployment,
# credentials, environment variables, .git directory or home directory is archived.
on:
  push:
    branches: [feat/cjk-publishing-upgrade-20260914]
    paths: [.github/workflows/diagnostic-workspace.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    if: github.ref == 'refs/heads/feat/cjk-publishing-upgrade-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package only tracked public source and installed dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/magmark-diagnostic"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/magmark-diagnostic/source.tar.gz"
          tar -czf "$RUNNER_TEMP/magmark-diagnostic/dependencies.tar.gz" node_modules
          git rev-parse HEAD > "$RUNNER_TEMP/magmark-diagnostic/source-commit.txt"
          node --version > "$RUNNER_TEMP/magmark-diagnostic/node-version.txt"
          cd "$RUNNER_TEMP/magmark-diagnostic"
          sha256sum source.tar.gz dependencies.tar.gz > checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: magmark-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/magmark-diagnostic/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
