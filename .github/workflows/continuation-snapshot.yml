name: Continuation source snapshot
on:
  push:
    branches: [feat/cjk-publishing-upgrade-20260914]
    paths: [.github/workflows/continuation-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.ref == 'refs/heads/feat/cjk-publishing-upgrade-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Archive tracked source and dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/magmark-snapshot"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/magmark-snapshot/source.tar.gz"
          tar -czf "$RUNNER_TEMP/magmark-snapshot/dependencies.tar.gz" node_modules
          git rev-parse HEAD > "$RUNNER_TEMP/magmark-snapshot/source-commit.txt"
          cd "$RUNNER_TEMP/magmark-snapshot"
          sha256sum source.tar.gz dependencies.tar.gz > checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: magmark-continuation-${{ github.sha }}
          path: ${{ runner.temp }}/magmark-snapshot/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
