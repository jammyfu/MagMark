name: Publishing quality

on:
  push:
    branches: [feat/cjk-publishing-upgrade-20260914]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publishing-quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Text compatibility
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:text
      - name: Verification gate unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:verify
      - name: Full typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Deep repository verification
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 tools/verify.py --deep
