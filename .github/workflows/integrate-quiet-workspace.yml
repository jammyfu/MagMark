name: Integrate verified quiet workspace

# One-time integration on the maintainer-approved feature branch only.
# Applies readable, hash-guarded source repairs; commits only after all checks pass.
on:
  push:
    branches: [feat/cjk-publishing-upgrade-20260914]
    paths: [.github/workflows/integrate-quiet-workspace.yml]

permissions:
  contents: write

concurrency:
  group: integrate-quiet-workspace
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'jammyfu/MagMark' && github.ref == 'refs/heads/feat/cjk-publishing-upgrade-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact tested source repairs
        run: python3 tools/integrate_quiet_workspace.py
      - name: Resolve pinned editor dependencies without changing existing versions
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json "$RUNNER_TEMP/quiet-before-lock.json"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'JS'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/quiet-before-lock.json')).packages;
          const after = JSON.parse(fs.readFileSync('package-lock.json')).packages;
          for (const [name, entry] of Object.entries(before)) {
            if (!name) continue;
            if (!after[name] || after[name].version !== entry.version || after[name].integrity !== entry.integrity) {
              throw new Error('Unexpected existing dependency change: ' + name);
            }
          }
          console.log('All existing locked dependency versions and integrities retained.');
          JS
      - name: Fresh locked installation
        run: npm ci
      - name: Strict typecheck including actual web entry
        run: npm run typecheck
      - name: Full unit and compatibility tests
        run: npm test
      - name: Verification gate tests
        run: npm run test:verify
      - name: Actual web production build
        run: npm run build
      - name: Deep checks
        run: python3 tools/verify.py --deep
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Controlled pagination regression
        run: npm run test:pagination
      - name: Actual workspace with production assets
        env:
          WORKSPACE_BUILD: '1'
        run: npm run test:workspace
      - name: Commit only verified source and lockfile to the feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          files = json.loads(pathlib.Path('tools/quiet-baseline-hashes.json').read_text())
          for name, (_, expected) in files.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, name
          allowed = set(files) | {'package-lock.json'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed <= allowed, changed - allowed
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: integrate verified baseline repairs and locked source-editor dependencies'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          BRANCH=feat/cjk-publishing-upgrade-20260914
          REMOTE=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$REMOTE" = "$EXPECTED_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD
